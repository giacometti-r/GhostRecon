apiVersion: v1
kind: Secret
metadata:
  name: ghostrecon-secrets
  namespace: ghostrecon
type: Opaque
stringData:
  GHOSTRECON_DATABASE_URL: "postgresql+asyncpg://ghostrecon:URL_SAFE_PASSWORD@postgresql.example.internal:5432/ghostrecon"
  GHOSTRECON_REDIS_URL: "redis://:URL_SAFE_PASSWORD@redis.example.internal:6379/0"
  GHOSTRECON_ATTIO_ACCESS_TOKEN: "REPLACE_ATTIO_TOKEN"
  GHOSTRECON_SERPAPI_API_KEY: "REPLACE_SERPAPI_KEY"
  GHOSTRECON_GOOGLE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\\nREPLACE_KEY_MATERIAL\\n-----END PRIVATE KEY-----\\n"
  GHOSTRECON_SMTP_PASSWORD: "REPLACE_SMTP_PASSWORD"
  GHOSTRECON_IMAP_PASSWORD: "REPLACE_IMAP_PASSWORD"
