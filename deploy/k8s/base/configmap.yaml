apiVersion: v1
kind: ConfigMap
metadata:
  name: ghostrecon-config
  namespace: ghostrecon
data:
  GHOSTRECON_PROFILE: "production"
  GHOSTRECON_LOG_LEVEL: "INFO"
  GHOSTRECON_GEOCODER_PROVIDER: "nominatim"
  GHOSTRECON_SEARCH_PROVIDER: "openserp"
  GHOSTRECON_NEWS_PROVIDER: "serpapi"
  GHOSTRECON_CRM_PROVIDER: "attio"
  GHOSTRECON_CALENDAR_PROVIDER: "google"
  GHOSTRECON_SMTP_PROVIDER: "smtp"
  GHOSTRECON_IMAP_PROVIDER: "imap"
  GHOSTRECON_ATTIO_BASE_URL: "https://api.attio.com"
  GHOSTRECON_NOMINATIM_USER_AGENT: "GhostRecon/0.1 (mailto:ops@company.ch)"
  GHOSTRECON_CRAWL_USER_AGENT: "GhostReconBot/0.1 (mailto:ops@company.ch)"
  GHOSTRECON_ATTIO_MEETINGS_LIST_API_SLUG: "ghostrecon-meetings"
  GHOSTRECON_EMAIL_VERIFIER_URL: "http://email-verifier:8080"
  GHOSTRECON_GOOGLE_CALENDAR_ID: "primary"
  GHOSTRECON_GOOGLE_CLIENT_EMAIL: "calendar-bot@company.ch"
  GHOSTRECON_GOOGLE_CALENDAR_SEND_UPDATES: "true"
  GHOSTRECON_SMTP_HOST: "smtp.company.ch"
  GHOSTRECON_SMTP_USERNAME: "ghostrecon"
  GHOSTRECON_SMTP_FROM_ADDRESS: "prospecting@company.ch"
  GHOSTRECON_IMAP_HOST: "imap.company.ch"
  GHOSTRECON_IMAP_USERNAME: "ghostrecon"
