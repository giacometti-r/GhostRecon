{{- if and .Values.localOIDC.enabled (or (eq .Values.profile "local") (eq .Values.profile "test")) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostrecon-local-oidc
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: local-oidc}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ghostrecon.name" . }}
        app.kubernetes.io/component: local-oidc
    spec:
      automountServiceAccountToken: false
      containers:
        - name: local-oidc
          image: {{ include "ghostrecon.image" . | quote }}
          command: ["uvicorn"]
          args: ["ghostrecon.local_oidc_provider:app", "--host", "0.0.0.0", "--port", "8080"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: local-oidc
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/component: local-oidc}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
{{- end }}
