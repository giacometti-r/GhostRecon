{{- range $service := .Values.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $service }}
  labels:
    {{- include "ghostrecon.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "ghostrecon.name" $ }}
    app.kubernetes.io/component: {{ $service }}
---
{{- end }}
