{{- if .Values.workers.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostrecon-worker
  labels:
    {{- include "ghostrecon.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.workers.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ghostrecon.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ghostrecon.name" . }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "ghostrecon.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery"]
          args: ["-A", "ghostrecon.worker_runtime:celery_app", "worker", "--loglevel=INFO"]
          env:
            - name: GHOSTRECON_SERVICE_NAME
              value: "worker"
            {{- include "ghostrecon.projectSecrets" (list . "worker") | nindent 12 }}
          envFrom:
            - configMapRef:
                name: ghostrecon-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
---
{{- end }}
{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostrecon-scheduler
  labels:
    {{- include "ghostrecon.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ghostrecon.name" . }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ghostrecon.name" . }}
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scheduler
          image: {{ include "ghostrecon.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery"]
          args:
            - "-A"
            - "ghostrecon.worker_runtime:celery_app"
            - "beat"
            - "--loglevel=INFO"
            - "--schedule=/tmp/celerybeat-schedule"
          env:
            - name: GHOSTRECON_SERVICE_NAME
              value: "scheduler"
            {{- include "ghostrecon.projectSecrets" (list . "scheduler") | nindent 12 }}
          envFrom:
            - configMapRef:
                name: ghostrecon-config
          volumeMounts:
            - name: beat-state
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: beat-state
          emptyDir: {}
{{- end }}
