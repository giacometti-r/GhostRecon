{{- if .Values.workers.enabled }}
{{- range $worker := .Values.workerQueues }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostrecon-worker-{{ $worker.name }}
  labels:
    {{- include "ghostrecon.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker-{{ $worker.name }}
spec:
  replicas: {{ $.Values.workers.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ghostrecon.name" $ }}
      app.kubernetes.io/component: worker-{{ $worker.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ghostrecon.name" $ }}
        app.kubernetes.io/component: worker-{{ $worker.name }}
    spec:
      serviceAccountName: ghostrecon-worker-{{ $worker.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "ghostrecon.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["celery"]
          args: ["-A", "ghostrecon.worker_runtime:celery_app", "worker", "--loglevel=INFO", "-Q", {{ $worker.queue | quote }}]
          env:
            - name: GHOSTRECON_SERVICE_NAME
              value: "worker"
            - name: GHOSTRECON_SERVICE_IDENTITY
              value: {{ printf "worker-%s" $worker.name | quote }}
            - name: GHOSTRECON_SERVICE_PRIVATE_KEY_PATH
              value: "/var/run/ghostrecon/identity/private-key.pem"
            - name: GHOSTRECON_SERVICE_PRIVATE_KEY_ID
              value: {{ $.Values.workloadKeyId | quote }}
            - name: GHOSTRECON_SERVICE_TRUST_BUNDLE_PATH
              value: "/var/run/ghostrecon/identity/trust-bundle.json"
            {{- include "ghostrecon.projectSecrets" (list $ "worker") | nindent 12 }}
          envFrom:
            - configMapRef:
                name: ghostrecon-config
          volumeMounts:
            - name: workload-identity
              mountPath: /var/run/ghostrecon/identity
              readOnly: true
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
      volumes:
        - name: workload-identity
          secret:
            secretName: ghostrecon-worker-{{ $worker.name }}-identity
            defaultMode: 0400
---
{{- end }}
{{- end }}
{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostrecon-scheduler
  labels:
    {{- include "ghostrecon.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ghostrecon.name" . }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ghostrecon.name" . }}
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: ghostrecon-scheduler
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scheduler
          image: {{ include "ghostrecon.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery"]
          args: ["-A", "ghostrecon.worker_runtime:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
          env:
            - name: GHOSTRECON_SERVICE_NAME
              value: "scheduler"
            - name: GHOSTRECON_SERVICE_IDENTITY
              value: "scheduler"
            - name: GHOSTRECON_SERVICE_PRIVATE_KEY_PATH
              value: "/var/run/ghostrecon/identity/private-key.pem"
            - name: GHOSTRECON_SERVICE_PRIVATE_KEY_ID
              value: {{ .Values.workloadKeyId | quote }}
            - name: GHOSTRECON_SERVICE_TRUST_BUNDLE_PATH
              value: "/var/run/ghostrecon/identity/trust-bundle.json"
            {{- include "ghostrecon.projectSecrets" (list . "scheduler") | nindent 12 }}
          envFrom:
            - configMapRef:
                name: ghostrecon-config
          volumeMounts:
            - name: beat-state
              mountPath: /tmp
            - name: workload-identity
              mountPath: /var/run/ghostrecon/identity
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: beat-state
          emptyDir: {}
        - name: workload-identity
          secret:
            secretName: ghostrecon-scheduler-identity
            defaultMode: 0400
{{- end }}
