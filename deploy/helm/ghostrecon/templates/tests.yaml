{{- if .Values.tests.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ghostrecon.fullname" . }}-datastore-test
  labels:
    {{- include "ghostrecon.labels" . | nindent 4 }}
    app.kubernetes.io/component: datastore-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ghostrecon.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: datastore-test
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: datastore-test
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
          args:
            - |
              import asyncio
              import os

              import asyncpg
              from redis.asyncio import Redis

              async def main() -> None:
                  database_url = os.environ["GHOSTRECON_DATABASE_URL"].replace(
                      "postgresql+asyncpg://", "postgresql://", 1
                  )
                  connection = await asyncpg.connect(database_url)
                  try:
                      is_superuser = await connection.fetchval(
                          "SELECT rolsuper FROM pg_roles WHERE rolname = current_user"
                      )
                      if is_superuser:
                          raise RuntimeError("GhostRecon database role must not be a superuser")
                      await connection.fetchval("SELECT 1")
                  finally:
                      await connection.close()

                  redis = Redis.from_url(os.environ["GHOSTRECON_REDIS_URL"])
                  try:
                      if not await redis.ping():
                          raise RuntimeError("Redis PING failed")
                  finally:
                      await redis.aclose()

              asyncio.run(main())
          envFrom:
            - secretRef:
                name: ghostrecon-secrets
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
