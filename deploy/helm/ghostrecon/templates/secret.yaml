{{- $secretEnv := deepCopy (.Values.secretEnv | default dict) -}}
{{- if .Values.postgresql.enabled -}}
  {{- if hasKey $secretEnv "GHOSTRECON_DATABASE_URL" -}}
    {{- fail "secretEnv.GHOSTRECON_DATABASE_URL must not be set when postgresql.enabled=true" -}}
  {{- end -}}
  {{- $username := required "postgresql.auth.username is required" .Values.postgresql.auth.username -}}
  {{- $database := required "postgresql.auth.database is required" .Values.postgresql.auth.database -}}
  {{- $password := required "postgresql.auth.password is required; provide it through the SOPS values file" .Values.postgresql.auth.password -}}
  {{- if or (gt (len $username) 63) (not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $username)) -}}
    {{- fail "postgresql.auth.username must be a valid PostgreSQL identifier of at most 63 characters" -}}
  {{- end -}}
  {{- if or (gt (len $database) 63) (not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $database)) -}}
    {{- fail "postgresql.auth.database must be a valid PostgreSQL identifier of at most 63 characters" -}}
  {{- end -}}
  {{- if not (regexMatch "^[A-Za-z0-9._~-]+$" $password) -}}
    {{- fail "postgresql.auth.password must contain only URL-safe characters: A-Z, a-z, 0-9, dot, underscore, tilde, or hyphen" -}}
  {{- end -}}
  {{- $_ := set $secretEnv "GHOSTRECON_DATABASE_URL" (printf "postgresql+asyncpg://%s:%s@%s:5432/%s" $username $password (include "ghostrecon.postgresql.fullname" .) $database) -}}
{{- else -}}
  {{- required "secretEnv.GHOSTRECON_DATABASE_URL is required when postgresql.enabled=false" (get $secretEnv "GHOSTRECON_DATABASE_URL") -}}
{{- end -}}
{{- if .Values.redis.enabled -}}
  {{- if hasKey $secretEnv "GHOSTRECON_REDIS_URL" -}}
    {{- fail "secretEnv.GHOSTRECON_REDIS_URL must not be set when redis.enabled=true" -}}
  {{- end -}}
  {{- $password := required "redis.auth.password is required; provide it through the SOPS values file" .Values.redis.auth.password -}}
  {{- if not (regexMatch "^[A-Za-z0-9._~-]+$" $password) -}}
    {{- fail "redis.auth.password must contain only URL-safe characters: A-Z, a-z, 0-9, dot, underscore, tilde, or hyphen" -}}
  {{- end -}}
  {{- $_ := set $secretEnv "GHOSTRECON_REDIS_URL" (printf "redis://:%s@%s:6379/0" $password (include "ghostrecon.redis.fullname" .)) -}}
{{- else -}}
  {{- required "secretEnv.GHOSTRECON_REDIS_URL is required when redis.enabled=false" (get $secretEnv "GHOSTRECON_REDIS_URL") -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: ghostrecon-secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    {{- include "ghostrecon.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := $secretEnv }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
