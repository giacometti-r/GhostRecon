{{- if .Values.emailVerifier.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-verifier
  labels:
    {{- include "ghostrecon.labels" . | nindent 4 }}
    app.kubernetes.io/component: email-verifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ghostrecon.name" . }}
      app.kubernetes.io/component: email-verifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ghostrecon.name" . }}
        app.kubernetes.io/component: email-verifier
    spec:
      containers:
        - name: email-verifier
          image: "{{ .Values.emailVerifier.image.repository }}{{ if .Values.emailVerifier.image.digest }}@{{ .Values.emailVerifier.image.digest }}{{ else }}:{{ .Values.emailVerifier.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.emailVerifier.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
{{- range $key, $value := .Values.emailVerifier.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.emailVerifier.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: email-verifier
  labels:
    {{- include "ghostrecon.labels" . | nindent 4 }}
    app.kubernetes.io/component: email-verifier
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "ghostrecon.name" . }}
    app.kubernetes.io/component: email-verifier
{{- end }}
