{{- range $service := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service }}
  labels:
    {{- include "ghostrecon.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ghostrecon.name" $ }}
      app.kubernetes.io/component: {{ $service }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ghostrecon.name" $ }}
        app.kubernetes.io/component: {{ $service }}
    spec:
      serviceAccountName: {{ $service }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $service }}
          image: {{ include "ghostrecon.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GHOSTRECON_SERVICE_NAME
              value: {{ $service | quote }}
            - name: GHOSTRECON_SERVICE_IDENTITY
              value: {{ $service | quote }}
            - name: GHOSTRECON_SERVICE_PRIVATE_KEY_PATH
              value: "/var/run/ghostrecon/identity/private-key.pem"
            - name: GHOSTRECON_SERVICE_PRIVATE_KEY_ID
              value: {{ $.Values.workloadKeyId | quote }}
            - name: GHOSTRECON_SERVICE_TRUST_BUNDLE_PATH
              value: "/var/run/ghostrecon/identity/trust-bundle.json"
            {{- include "ghostrecon.projectSecrets" (list $ $service) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: ghostrecon-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: workload-identity
              mountPath: /var/run/ghostrecon/identity
              readOnly: true
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
      volumes:
        - name: workload-identity
          secret:
            secretName: ghostrecon-{{ $service }}-identity
            defaultMode: 0400
---
{{- end }}
