# SOPS/Age secret values placeholder.
# Populate the values below, then encrypt this file before committing:
#   sops -e -i deploy/helm/ghostrecon/secrets.sops.yaml
postgresql:
  auth:
    postgresPassword: REPLACE_WITH_URL_SAFE_POSTGRES_ADMIN_PASSWORD
    password: REPLACE_WITH_URL_SAFE_GHOSTRECON_DATABASE_PASSWORD

redis:
  auth:
    password: REPLACE_WITH_URL_SAFE_REDIS_PASSWORD

secretEnv:
  GHOSTRECON_ATTIO_ACCESS_TOKEN: REPLACE_WITH_REAL_ATTIO_API_SECRET
  GHOSTRECON_ATTIO_WEBHOOK_SECRET: REPLACE_WITH_REAL_ATTIO_WEBHOOK_SECRET
  GHOSTRECON_GOOGLE_CLIENT_EMAIL: REPLACE_WITH_GOOGLE_SERVICE_ACCOUNT_EMAIL
  GHOSTRECON_GOOGLE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\\nREPLACE_WITH_ESCAPED_KEY\\n-----END PRIVATE KEY-----\\n"
  GHOSTRECON_GOOGLE_DELEGATED_SUBJECT: REPLACE_WITH_WORKSPACE_USER_EMAIL
