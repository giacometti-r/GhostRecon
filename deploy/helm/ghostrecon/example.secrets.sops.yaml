# SOPS/Age secret values placeholder.
# Populate the values below, then encrypt this file before committing:
#   sops -e -i deploy/helm/ghostrecon/secrets.sops.yaml
postgresql:
  auth:
    postgresPassword: REPLACE_WITH_URL_SAFE_POSTGRES_ADMIN_PASSWORD
    password: REPLACE_WITH_URL_SAFE_GHOSTRECON_DATABASE_PASSWORD

redis:
  auth:
    password: REPLACE_WITH_URL_SAFE_REDIS_PASSWORD

env:
  GHOSTRECON_GEOCODER_PROVIDER: nominatim
  GHOSTRECON_SEARCH_PROVIDER: openserp
  GHOSTRECON_NEWS_PROVIDER: serpapi
  GHOSTRECON_EMAIL_VERIFIER_PROVIDER: http
  GHOSTRECON_CRM_PROVIDER: attio
  GHOSTRECON_CALENDAR_PROVIDER: google
  GHOSTRECON_SMTP_PROVIDER: smtp
  GHOSTRECON_IMAP_PROVIDER: imap
  GHOSTRECON_NOMINATIM_USER_AGENT: "GhostRecon/0.1 (mailto:REPLACE_WITH_OPERATOR_EMAIL)"
  GHOSTRECON_CRAWL_USER_AGENT: "GhostReconBot/0.1 (mailto:REPLACE_WITH_OPERATOR_EMAIL)"
  GHOSTRECON_GOOGLE_CALENDAR_ID: REPLACE_WITH_CALENDAR_ID
  GHOSTRECON_GOOGLE_CLIENT_EMAIL: REPLACE_WITH_GOOGLE_SERVICE_ACCOUNT_EMAIL
  # Optional for Workspace domain-wide delegation:
  # GHOSTRECON_GOOGLE_DELEGATED_SUBJECT: workspace-owner@company.example
  GHOSTRECON_SMTP_HOST: REPLACE_WITH_SMTP_HOST
  GHOSTRECON_SMTP_USERNAME: REPLACE_WITH_SMTP_USERNAME
  GHOSTRECON_SMTP_FROM_ADDRESS: REPLACE_WITH_REAL_SENDER_ADDRESS
  GHOSTRECON_IMAP_HOST: REPLACE_WITH_IMAP_HOST
  GHOSTRECON_IMAP_USERNAME: REPLACE_WITH_IMAP_USERNAME

secretEnv:
  GHOSTRECON_ATTIO_ACCESS_TOKEN: REPLACE_WITH_REAL_ATTIO_API_SECRET
  # Optional when the OpenSERP deployment requires authentication:
  # GHOSTRECON_OPENSERP_API_KEY: REPLACE_WITH_OPENSERP_API_SECRET
  GHOSTRECON_SERPAPI_API_KEY: REPLACE_WITH_SERPAPI_API_SECRET
  GHOSTRECON_GOOGLE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\\nREPLACE_WITH_ESCAPED_KEY\\n-----END PRIVATE KEY-----\\n"
  GHOSTRECON_SMTP_PASSWORD: REPLACE_WITH_SMTP_PASSWORD
  GHOSTRECON_IMAP_PASSWORD: REPLACE_WITH_IMAP_PASSWORD
