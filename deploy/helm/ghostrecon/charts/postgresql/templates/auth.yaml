{{- include "postgresql.validate" . -}}
{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}-auth
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.auth.postgresPassword | quote }}
  app-password: {{ .Values.auth.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgresql.fullname" . }}-init
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
data:
  10-create-application-database.sh: |-
    #!/bin/sh
    set -eu

    psql --set=ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" \
      --set=app_user="$GHOSTRECON_DB_USER" \
      --set=app_database="$GHOSTRECON_DB_NAME" <<'SQL'
    \set app_password `cat /run/secrets/app-password`

    SELECT format(
      'CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
      :'app_user',
      :'app_password'
    )
    WHERE NOT EXISTS (
      SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = :'app_user'
    ) \gexec

    SELECT format(
      'CREATE DATABASE %I OWNER %I',
      :'app_database',
      :'app_user'
    )
    WHERE NOT EXISTS (
      SELECT 1 FROM pg_catalog.pg_database WHERE datname = :'app_database'
    ) \gexec
    SQL
{{- end }}
