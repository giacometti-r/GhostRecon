profile: local

image:
  repository: ghostrecon
  tag: local
  digest: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicaCount: 2

serviceAccount:
  create: true
  name: ghostrecon


workloadKeyId: current

ingress:
  enabled: false
  className: nginx
  host: ghostrecon.local
  tlsSecretName: ghostrecon-tls

networkPolicy:
  enabled: true

localOIDC:
  enabled: true
env:
  GHOSTRECON_LOG_LEVEL: INFO
  GHOSTRECON_GEOCODER_PROVIDER: local_demo
  GHOSTRECON_SEARCH_PROVIDER: local_demo
  GHOSTRECON_NEWS_PROVIDER: local_demo
  GHOSTRECON_EMAIL_VERIFIER_PROVIDER: http
  GHOSTRECON_CRM_PROVIDER: local_demo
  GHOSTRECON_CALENDAR_PROVIDER: fake
  GHOSTRECON_SMTP_PROVIDER: disabled
  GHOSTRECON_IMAP_PROVIDER: disabled
  GHOSTRECON_ATTIO_BASE_URL: https://api.attio.com
  GHOSTRECON_GATEWAY_BASE_URL: http://gateway-service:8080
  GHOSTRECON_CONSOLE_REQUEST_TIMEOUT_SECONDS: "10"
  GHOSTRECON_ATTIO_MEETINGS_LIST_API_SLUG: ghostrecon-meetings
  GHOSTRECON_EMAIL_VERIFIER_URL: http://email-verifier:8080
  GHOSTRECON_GOOGLE_CALENDAR_ID: primary
  GHOSTRECON_GOOGLE_CALENDAR_SEND_UPDATES: "true"

# Additional secret values are supplied from secrets.sops.yaml via helm-secrets.
# Database and Redis URLs are generated when their bundled instances are enabled.
secretEnv: {}

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 17.10-alpine3.23
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    username: ghostrecon
    database: ghostrecon
    postgresPassword: ""
    password: ""
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  networkPolicy:
    enabled: true

redis:
  enabled: true
  image:
    repository: redis
    tag: 7.4.8-alpine3.21
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    password: ""
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  networkPolicy:
    enabled: true

migrations:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600
  retryAttempts: 30
  retryDelaySeconds: 5

tests:
  enabled: true

services:
  - gateway-service
  - event-intelligence-service
  - incident-intelligence-service
  - crm-service
  - ingestion-service
  - enrichment-service
  - email-intelligence-service
  - scoring-routing-service
  - sequencing-service
  - meeting-handoff-service
  - governance-service
  - console-service
  - reporting-service


workerQueues:
  - {name: source-fetch, queue: source-fetch}
  - {name: event-parser, queue: event-parser}
  - {name: incident-parser, queue: incident-parser}
  - {name: watch-monitor, queue: watch-monitor}
  - {name: enrichment, queue: enrichment}
  - {name: email-intelligence, queue: email-intelligence}
  - {name: governance, queue: governance}
  - {name: crm-export, queue: crm-export}
  - {name: sequencing, queue: sequencing}
  - {name: meeting-sync, queue: meeting-sync}
workers:
  enabled: true
  replicaCount: 1

scheduler:
  enabled: true
  replicaCount: 1

preflight:
  enabled: true
  backoffLimit: 0

secretProjection:
  gateway-service: [GHOSTRECON_DATABASE_URL, GHOSTRECON_REDIS_URL, GHOSTRECON_SESSION_HMAC_KEY, GHOSTRECON_OIDC_TRANSACTION_ENCRYPTION_KEY, GHOSTRECON_AUDIT_HMAC_KEY, GHOSTRECON_OIDC_CLIENT_SECRET, GHOSTRECON_ATTIO_ACCESS_TOKEN, GHOSTRECON_OPENSERP_API_KEY, GHOSTRECON_SERPAPI_API_KEY, GHOSTRECON_GOOGLE_PRIVATE_KEY, GHOSTRECON_SMTP_PASSWORD, GHOSTRECON_IMAP_PASSWORD]
  event-intelligence-service: [GHOSTRECON_DATABASE_URL]
  incident-intelligence-service: [GHOSTRECON_DATABASE_URL, GHOSTRECON_SERPAPI_API_KEY]
  crm-service: [GHOSTRECON_DATABASE_URL, GHOSTRECON_ATTIO_ACCESS_TOKEN]
  ingestion-service: [GHOSTRECON_DATABASE_URL]
  enrichment-service: [GHOSTRECON_DATABASE_URL, GHOSTRECON_OPENSERP_API_KEY]
  email-intelligence-service: [GHOSTRECON_DATABASE_URL]
  scoring-routing-service: [GHOSTRECON_DATABASE_URL]
  sequencing-service: [GHOSTRECON_DATABASE_URL, GHOSTRECON_ATTIO_ACCESS_TOKEN, GHOSTRECON_GOOGLE_PRIVATE_KEY, GHOSTRECON_SMTP_PASSWORD, GHOSTRECON_IMAP_PASSWORD]
  meeting-handoff-service: [GHOSTRECON_DATABASE_URL, GHOSTRECON_ATTIO_ACCESS_TOKEN, GHOSTRECON_GOOGLE_PRIVATE_KEY]
  governance-service: [GHOSTRECON_DATABASE_URL]
  console-service: []
  reporting-service: [GHOSTRECON_DATABASE_URL]
  worker: [GHOSTRECON_DATABASE_URL, GHOSTRECON_REDIS_URL, GHOSTRECON_ATTIO_ACCESS_TOKEN, GHOSTRECON_OPENSERP_API_KEY, GHOSTRECON_SERPAPI_API_KEY, GHOSTRECON_GOOGLE_PRIVATE_KEY, GHOSTRECON_SMTP_PASSWORD, GHOSTRECON_IMAP_PASSWORD]
  scheduler: [GHOSTRECON_REDIS_URL]
  migration-job: [GHOSTRECON_DATABASE_URL]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

emailVerifier:
  enabled: true
  image:
    repository: umutert/emailvalidator
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
