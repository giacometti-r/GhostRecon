services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ghostrecon
      POSTGRES_USER: ghostrecon
      POSTGRES_PASSWORD: ghostrecon
    ports:
      - "${GHOSTRECON_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostrecon -d ghostrecon"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${GHOSTRECON_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command:
      - sh
      - -ec
      - |
        attempt=1
        until alembic upgrade head; do
          if [ "$$attempt" -ge 20 ]; then
            echo "database migration failed after $$attempt attempts" >&2
            exit 1
          fi
          echo "database unavailable; retrying migration in 3 seconds" >&2
          attempt=$$((attempt + 1))
          sleep 3
        done
    environment:
      GHOSTRECON_ENVIRONMENT: local
      GHOSTRECON_SERVICE_NAME: migration-job
      GHOSTRECON_DATABASE_URL: postgresql+asyncpg://ghostrecon:ghostrecon@postgres:5432/ghostrecon
      GHOSTRECON_REDIS_URL: redis://redis:6379/0
      GHOSTRECON_EMAIL_VERIFIER_URL: http://email-verifier:8080
    depends_on:
      postgres:
        condition: service_healthy

  gateway-service:
    build: .
    environment: &service-env
      GHOSTRECON_ENVIRONMENT: local
      GHOSTRECON_SERVICE_NAME: gateway-service
      GHOSTRECON_DATABASE_URL: postgresql+asyncpg://ghostrecon:ghostrecon@postgres:5432/ghostrecon
      GHOSTRECON_REDIS_URL: redis://redis:6379/0
      GHOSTRECON_EMAIL_VERIFIER_URL: http://email-verifier:8080
    ports:
      - "${GHOSTRECON_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  console-service:
    build: .
    environment:
      <<: *service-env
      GHOSTRECON_SERVICE_NAME: console-service
      GHOSTRECON_GATEWAY_BASE_URL: http://gateway-service:8080
    ports:
      - "${GHOSTRECON_CONSOLE_HTTP_PORT:-8082}:8080"
    depends_on:
      gateway-service:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["celery", "-A", "ghostrecon.worker_runtime:celery_app", "worker", "--loglevel=INFO"]
    environment:
      <<: *service-env
      GHOSTRECON_SERVICE_NAME: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    build: .
    command:
      [
        "celery",
        "-A",
        "ghostrecon.worker_runtime:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment:
      <<: *service-env
      GHOSTRECON_SERVICE_NAME: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  email-verifier:
    image: umutert/emailvalidator:latest
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "${GHOSTRECON_EMAIL_VERIFIER_PORT:-8081}:8080"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
