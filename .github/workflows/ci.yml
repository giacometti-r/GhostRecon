name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GHOSTRECON_PROFILE: test

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: make install
      - run: make lint
      - run: make type
      - run: make security
      - run: pytest tests/unit
      - run: python scripts/smoke_import.py

  migration-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: ghostrecon
          POSTGRES_USER: ghostrecon
          POSTGRES_PASSWORD: integration-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ghostrecon -d ghostrecon"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GHOSTRECON_SERVICE_NAME: migration-job
      GHOSTRECON_DATABASE_URL: postgresql+asyncpg://ghostrecon:integration-password@localhost:5432/ghostrecon
      GHOSTRECON_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: make install
      - run: make config-check
      - run: make migration-check
      - run: python -c "import asyncio; from redis.asyncio import Redis; asyncio.run(Redis.from_url('redis://localhost:6379/0').ping())"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: make install
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/browser

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: make helm-check
      - run: mkdir -p release-evidence
      - run: helm template ghostrecon deploy/helm/ghostrecon -f deploy/helm/ghostrecon/tests/values-production.yaml > release-evidence/production-manifests.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendered-manifests
          path: release-evidence/production-manifests.yaml

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t ghostrecon:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghostrecon:ci
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t ghostrecon:ci .
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ghostrecon:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ghostrecon:ci
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sboms
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
