name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ghostrecon
          POSTGRES_USER: ghostrecon
          POSTGRES_PASSWORD: ghostrecon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghostrecon -d ghostrecon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
      - run: make install
      - run: make lint
      - run: make type
      - run: make test
      - run: make helm-check
      - run: python scripts/smoke_import.py
      - run: docker build -t ghostrecon:ci .
