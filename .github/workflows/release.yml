name: staging-release-evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-provider-checks:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      GHOSTRECON_PROFILE: staging
      GHOSTRECON_SERVICE_NAME: worker
      GHOSTRECON_DATABASE_URL: ${{ secrets.GHOSTRECON_DATABASE_URL }}
      GHOSTRECON_REDIS_URL: ${{ secrets.GHOSTRECON_REDIS_URL }}
      GHOSTRECON_GEOCODER_PROVIDER: nominatim
      GHOSTRECON_SEARCH_PROVIDER: openserp
      GHOSTRECON_NEWS_PROVIDER: serpapi
      GHOSTRECON_CRM_PROVIDER: attio
      GHOSTRECON_CALENDAR_PROVIDER: google
      GHOSTRECON_SMTP_PROVIDER: smtp
      GHOSTRECON_IMAP_PROVIDER: imap
      GHOSTRECON_ATTIO_ACCESS_TOKEN: ${{ secrets.GHOSTRECON_ATTIO_ACCESS_TOKEN }}
      GHOSTRECON_OPENSERP_API_KEY: ${{ secrets.GHOSTRECON_OPENSERP_API_KEY }}
      GHOSTRECON_SERPAPI_API_KEY: ${{ secrets.GHOSTRECON_SERPAPI_API_KEY }}
      GHOSTRECON_GOOGLE_CALENDAR_ID: ${{ vars.GHOSTRECON_GOOGLE_CALENDAR_ID }}
      GHOSTRECON_GOOGLE_CLIENT_EMAIL: ${{ secrets.GHOSTRECON_GOOGLE_CLIENT_EMAIL }}
      GHOSTRECON_GOOGLE_PRIVATE_KEY: ${{ secrets.GHOSTRECON_GOOGLE_PRIVATE_KEY }}
      GHOSTRECON_SMTP_HOST: ${{ vars.GHOSTRECON_SMTP_HOST }}
      GHOSTRECON_SMTP_USERNAME: ${{ secrets.GHOSTRECON_SMTP_USERNAME }}
      GHOSTRECON_SMTP_PASSWORD: ${{ secrets.GHOSTRECON_SMTP_PASSWORD }}
      GHOSTRECON_SMTP_FROM_ADDRESS: ${{ vars.GHOSTRECON_SMTP_FROM_ADDRESS }}
      GHOSTRECON_IMAP_HOST: ${{ vars.GHOSTRECON_IMAP_HOST }}
      GHOSTRECON_IMAP_USERNAME: ${{ secrets.GHOSTRECON_IMAP_USERNAME }}
      GHOSTRECON_IMAP_PASSWORD: ${{ secrets.GHOSTRECON_IMAP_PASSWORD }}
      GHOSTRECON_NOMINATIM_USER_AGENT: ${{ vars.GHOSTRECON_NOMINATIM_USER_AGENT }}
      GHOSTRECON_CRAWL_USER_AGENT: ${{ vars.GHOSTRECON_CRAWL_USER_AGENT }}
      GHOSTRECON_EMAIL_VERIFIER_URL: ${{ vars.GHOSTRECON_EMAIL_VERIFIER_URL }}
      GHOSTRECON_OPENSERP_BASE_URL: ${{ vars.GHOSTRECON_OPENSERP_BASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: make install
      - run: mkdir -p release-evidence
      - name: Validate configuration
        run: python -m ghostrecon.common.preflight --format json | tee release-evidence/preflight.json
      - name: Run bounded non-mutating checks
        run: python scripts/staging_checks.py | tee release-evidence/provider-checks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: staging-release-evidence
          path: release-evidence/
