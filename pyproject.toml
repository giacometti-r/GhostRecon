[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostrecon"
version = "0.1.0"
description = "CRM-first cybersecurity prospecting and pre-sales automation platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GhostRecon Maintainers" }]
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "celery[redis]>=5.4",
  "cryptography>=42.0",
  "dash>=3.0",
  "dash-iconify>=0.1",
  "defusedxml>=0.7",
  "dnspython>=2.6",
  "email-validator>=2.1",
  "fastapi>=0.111",
  "httpx>=0.27",
  "jinja2>=3.1",
  "opentelemetry-api>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "opentelemetry-sdk>=1.25",
  "plotly>=6.0",
  "prometheus-client>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-json-logger>=2.0",
  "redis>=5.0",
  "scrapy>=2.11",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.1",
  "tldextract>=5.1",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-playwright>=0.5",
  "respx>=0.21",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ghostrecon.console" = ["assets/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_untyped_decorators = false
disable_error_code = ["attr-defined", "arg-type", "call-overload", "assignment", "misc", "union-attr"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
